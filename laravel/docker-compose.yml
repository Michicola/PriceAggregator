services:
    app:
        image: php:8.4-apache 
        container_name: monitor_app
        command: >
            sh -c "docker-php-ext-install pdo pdo_mysql && 
            a2enmod rewrite && 
            sed -ri -e 's!/var/www/html!/var/www/html/public!g' /etc/apache2/sites-available/*.conf && 
            apache2-foreground"
        ports:
            - "8080:80"
        volumes:
            - .:/var/www/html
        environment:
            - DB_CONNECTION=mysql
            - DB_HOST=mysql_db
            - DB_PORT=3306
            - DB_DATABASE=price_monitor
            - DB_USERNAME=sail
            - DB_PASSWORD=123
        depends_on:
            - mysql_db
        networks:
            - price-network

    mysql_db:
        image: mysql:8.0
        container_name: monitor_db
        ports:
            - "33066:3306"
        environment:
            - MYSQL_ROOT_PASSWORD=123
            - MYSQL_DATABASE=price_monitor
            - MYSQL_USER=sail
            - MYSQL_PASSWORD=123
        volumes:
            - mysql-data:/var/lib/mysql
        networks:
            - price-network

networks:
    price-network:
        driver: bridge

volumes:
    mysql-data:
        driver: local
